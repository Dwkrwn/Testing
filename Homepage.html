<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senopati Ekspress</title>
    <style>
        body {
            /* margin: 0; */
            /* padding: 0; */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
        }

        .container {
            width: 800px;
            height: 600px;
            margin: 20px auto;
            background-color: rgb(255, 255, 255);
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }

        .logo img {
            width: 70px;
            height: 70px;
            background-color: gray;
            border-radius: 50%;
        }

        h1 {
            font-size: 24px;
            color: navy;
        }

        .con-buttons button {
            margin-left: 10px;
            padding: 5px 10px;
            background-color: navy;
            color: white;
            border: none;
            cursor: pointer;
            transition: .5s;
        }

        .con-buttons button:hover {
            background-color: rgb(139, 0, 39);
            box-shadow: 2px 2px 2px rgba(0, 0, 0, .5)
        }

        main {
            text-align: center;
            margin: 20px 0;
        }

        .display-image {
            width: 80%;
            height: 200px;
            margin: 0 auto;
            border: 2px dashed #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dots span {
            display: inline-block;
            width: 10px;
            height: 10px;
            margin: 5px;
            background-color: gray;
            border-radius: 50%;
        }

        .container-nav {
            margin-top: 30px;
        }

        nav button {
            margin: 10px;
            padding: 10px 20px;
            background-color: navy;
            color: white;
            border: none;
            cursor: pointer;
            transition: .5s;
        }

        nav button:hover {
            background-color: rgb(138, 138, 232);
            box-shadow: 2px 2px 2px rgba(0, 0, 0, .5);
        }

        footer {
            text-align: center;
            margin-top: 45px;
        }

        footer p {
            margin: 1px 0;
        }

        footer p:first-child {
            font-size: 24px;
            color: navy;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">
                <img src="Wareframe/Logo Sinopati.jpg" alt="">
            </div>
            <h1>Senopati Ekspress</h1>
            <div class="con-buttons">
                <button>Login</button>
                <button>Register</button>
            </div>
        </header>

        <main>
            <div class="display-image">
                <p>Display Image</p>
            </div>
            <div class="dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <nav class="container-nav">
                <button>Layanan Pengiriman</button>
                <button>Lacak Pengiriman</button>
                <button>Pembayaran</button>
                <button>Keluar</button>
            </nav>
        </main>

        <footer>
            <p>KTK</p>
            <p>Kemudahan Akses - Transparansi Biaya - Tracking Real-time</p>
            <p>&copy; 2024 SENOPATI EKSPRESS</p>
        </footer>
    </div>
</body>

</html>
