<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formlogin</title>
    <!-- <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'> -->
    <style>
        *,
        html {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 420px;
            background: transparent;
            border: 2px solid rgb(0, 0, 0);
            backdrop-filter: blur(20px);
            box-shadow: 0 0 10px rgba(0, 0, 0, -1);
            color: rgb(255, 255, 255);
            border-radius: 10px;
            padding: 30px 40px;
        }

        .container h1 {
            text-align: center;
            font-size: 36px;
        }

        .container .form-login {
            position: relative;
            width: 100%;
            height: 50px;
            margin: 30px 0;
        }

        .form-login input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            border: 2px solid rgba(255, 255, 255, 2);
            border-radius: 40px;
            font-size: 16px;
            color: #fff;
            padding: 20px 45px 20px 20px;
        }

        .form-login input::placeholder {
            color: white;
        }

        .form-login i {
            position: absolute;
            right: 20px;
            top: 30%;
            transform: translate(-50%);
            font-size: 20px;

        }

        .coba-input {
            display: flex;
            justify-content: space-between;
            font-size: 14.5px;
            margin: -15px 0 15px;
        }

        .coba-input label input {
            accent-color: red;
            margin-right: 3px;
        }

        .coba-input a {
            color: white;
            text-decoration: none;
        }

        .coba-input a:hover {
            text-decoration: underline;
        }

        .btn {
            width: 100%;
            height: 40px;
            background: white;
            border: none;
            outline: none;
            border-radius: 40px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 1);
            cursor: pointer;
            font-size: 16px;
            color: #333;
            font-weight: 600;
        }

        .link-register {
            font-size: 14.4px;
            text-align: center;
            margin: 20px 0 15px;
        }

        .link-register p a {
            color: aqua;
            text-decoration: none;
            font-family: 600;
        }

        .link-register p a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">
        <form action="">
            <h1>Login</h1>

            <!-- FORM USER -->
            <div class="form-login">
                <input type="text" id="username" placeholder="Username" required>
                <label for="username"><i class='bx bxs-user'></i></label>
            </div>

            <!-- FORM PASSWORD -->
            <div class="form-login">
                <input type="password" id="password" placeholder="password" required>
                <label for="password"><i class='bx bxs-lock'></i></label>
            </div>


            <div class="coba-input">
                <label><input type="checkbox">Remamber me</label>
                <a href="#">Forgot password</a>
            </div>

            <button type="submit" class="btn">Login</button>

            <div class="link-register">
                <p>Dont't have an account? <a href="#">Register</a></p>
            </div>
        </form>
    </div>
</body>

</html>
